name: Build Android APK

# Wraps the web app in a native Android shell (Capacitor), signs it, and publishes
# the APK as a GitHub release. Stable download link:
#   https://github.com/<owner>/<repo>/releases/latest/download/<repo>.apk
#
# Signing: add repository secrets ANDROID_KEYSTORE_BASE64 (base64 of a .jks/.keystore),
# ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS so every build has the same signature
# (lets phones update in place). Without them, each build is signed with a fresh
# temporary key and the old app must be uninstalled before installing a new build.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      APP: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Build web app
        run: |
          npm ci
          npm run build

      - name: Create Android project
        run: |
          npx cap add android
          mkdir -p assets
          cp public/icon-512.png assets/icon-only.png
          cp public/icon-maskable-512.png assets/icon-foreground.png
          node -e "require('sharp')({create:{width:1024,height:1024,channels:3,background:'#FFFFFF'}}).png().toFile('assets/icon-background.png')"
          npx capacitor-assets generate --android --iconBackgroundColor '#FFFFFF' --splashBackgroundColor '#FFFFFF'
          npx cap sync android

      - name: Set version
        run: |
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle
          grep -n "version" android/app/build.gradle

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          else
            echo "::warning::No signing secrets set - using a temporary key for this build."
            KS_PASS=$(openssl rand -hex 16); KS_ALIAS=temp
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass "$KS_PASS" -keypass "$KS_PASS" -dname "CN=Servizato, C=IN"
          fi
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" --ks-key-alias "$KS_ALIAS" \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" --out "$APP.apk" aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify "$APP.apk"
          rm -f "$RUNNER_TEMP/release.keystore"
          ls -la "$APP.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-apk
          path: ${{ env.APP }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Android app (build ${{ github.run_number }})
          body: |
            Install on Android: download **${{ env.APP }}.apk** below, open it, and allow "Install unknown apps" for your browser or Files app when asked.
          files: ${{ env.APP }}.apk
          make_latest: true
